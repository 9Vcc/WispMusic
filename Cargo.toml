[workspace]
resolver = "3"
members = ["src/crates/*", "xtask"]
default-members = ["src/crates/wisp"]
# 归档与参考代码不是本工作区成员：tauri/ 是上一代版本，
# reference/ 是参考实现与对照项目，src/vendor/ 是 vendored 依赖。
exclude = [
    "src/vendor",
    "tauri",
    "reference",
]

[workspace.package]
version = "0.2.6"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/9Vcc/WispMusic"

[workspace.dependencies]
embed = { path = "src/crates/embed" }
cli = { path = "src/crates/cli" }
i18n = { path = "src/crates/i18n" }
icons = { path = "src/crates/icons" }
logic = { path = "src/crates/logic" }
music = { path = "src/crates/music" }
paths = { path = "src/crates/paths" }
wisp-plugin-api = { path = "src/crates/wisp-plugin-api" }
wisp-plugin-host = { path = "src/crates/wisp-plugin-host" }
wisp-plugin-pack = { path = "src/crates/wisp-plugin-pack", default-features = false }
state = { path = "src/crates/state" }
soundtouch-rs = { path = "src/vendor/soundtouch-rs" }
storage = { path = "src/crates/storage" }
input = { path = "src/crates/input" }
router = { path = "src/crates/router" }
ui = { path = "src/crates/ui" }
views = { path = "src/crates/views" }
webview = { path = "src/crates/webview" }

alsa = "0.11"
arc-swap = "1"
anyhow = "1.0"
ardftsrc = "0.4.4"
async-trait = "0.1"
aes = "0.8"
base64 = "0.23"
bytes = "1"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
cc = "1"
clap = { version = "4", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "derive",
] }
clap_complete = "4.6"
flate2 = "1"
cpal = "0.18"
dirs = "7"
deunicode = "1.6"
env_logger = "0.11"
fastrand = "2.5"
futures = "0.3"
gethostname = "1.1"
fluent-bundle = "0.16"
gpui = { git = "https://github.com/sonorahq/gpui", rev = "17c64aee9228a133d05914487a487676364b299e" }
gpui_platform = { git = "https://github.com/sonorahq/gpui", rev = "17c64aee9228a133d05914487a487676364b299e", features = [
    "font-kit",
    "wayland",
    "x11",
] }
http = "1.5"
winresource = "0.1"
x11rb = { version = "0.14", features = ["allow-unsafe-code"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Only the core wasm runtime is used: plugins are precompiled .wasm bytecode, the host
# instantiates them with Cranelift, and epoch interruption is the watchdog. Disabling wasmtime's
# default features drops WAT, components, GC, caching, profiling, backtraces and the pooling
# allocator from the binary.
wasmtime = { version = "50.0.2", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
] }
wat = "1"
webview2-com = "0.39"
interprocess = "2.4"
widestring = "1.2"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
jiff = { version = "0.2", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-bundle-platform",
    "tzdb-zoneinfo",
] }
kakasi = "0.1"
ksni = { version = "0.3", default-features = false, features = [
    "async-io",
    "blocking",
] }
zbus = { version = "6", default-features = false, features = [
    "proxy",
    "tokio",
] }
libc = "0.2"
lofty = "0.25"
log = "0.4"
md-5 = "0.11"
minisign-verify = "0.3"
num-bigint = "0.4"
moka = { version = "0.12", features = ["future", "sync"] }
mpris-server = "0.11"
notify = "8.2"
open = "5.4"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
] }
objc2-core-audio = "0.3"
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKHTTPCookieStore",
    "WKNavigation",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusItem",
    "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFString",
] }
objc2-io-kit = { version = "0.3", default-features = false, features = [
    "std",
    "pwr_mgt",
] }
ashpd = { version = "0.14", default-features = false, features = [
    "async-io",
    "inhibit",
    "settings",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "form",
    "json",
    "query",
    "rustls-no-provider",
] }
qrcodegen = "1"
raw-window-handle = "0.6"
resvg = { version = "0.49", default-features = false }
ring = "0.17"
roxmltree = "0.21"
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "experimental",
] }
rtrb = "0.4"
rusqlite = { version = "0.43", features = ["bundled"] }
# Pinned exactly: a young crate, and the decoder every HE-AAC stream goes through.
rusty_aac = { version = "=1.1.2", default-features = false }
rustfft = "6.4"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
semver = "1"
serde-saphyr = { version = "2.1", default-features = false, features = [
    "deserialize",
] }
sha1 = "0.11"
sha2 = "0.11"
smallvec = { version = "1.16", features = ["union"] }
souvlaki = "0.9"
sys-locale = "0.3"
symphonia = { version = "0.5.5", default-features = false, features = [
    "aac",
    "mkv",
    "ogg",
    "isomp4",
] }
tempfile = "3.27"
tray-icon = { version = "0.26", default-features = false }
unic-langid = { version = "0.9", features = ["macros"] }
unicode-bidi = "0.3"
unicode-segmentation = "1.13"
walkdir = "2"

percent-encoding = "2.3"
protobuf = "3"
pulseaudio = "0.3.2"
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "net",
    "fs",
    "io-util",
    "macros",
    "process",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }

[patch.crates-io]
rodio = { git = "https://github.com/RustAudio/rodio", rev = "880aaba54b00aead53651ed1ccbdb672d1375a95" }

[workspace.lints.clippy]
redundant_clone = "warn"
needless_collect = "warn"
dbg_macro = "warn"
empty_drop = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
inefficient_to_string = "warn"
set_contains_or_insert = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
large_stack_frames = "warn"
or_fun_call = "warn"
large_types_passed_by_value = "warn"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false

[profile.dev]
incremental = false
split-debuginfo = "unpacked"

[profile.test]
incremental = false

[profile.dev.package.ui]
debug = false
opt-level = 2

[profile.dev.package.views]
debug = false
opt-level = 2

[profile.dev.package."*"]
debug = false
opt-level = 2

# The audio path runs in real time, decoding, resampling and mixing every sample, so it is built
# fully optimised even in debug builds.
[profile.dev.package.music]
opt-level = 3

[profile.dev.package.rodio]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3

[profile.dev.package.ardftsrc]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.rusty_aac]
opt-level = 3

# Keep the real-time audio path at full speed while the rest of the release build favours size.
[profile.release.package.music]
opt-level = 3

[profile.release.package.rodio]
opt-level = 3

[profile.release.package.cpal]
opt-level = 3

[profile.release.package.ardftsrc]
opt-level = 3

[profile.release.package.realfft]
opt-level = 3

[profile.release.package.rustfft]
opt-level = 3

[profile.release.package.rusty_aac]
opt-level = 3
