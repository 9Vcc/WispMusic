[package]
name = "wisp-plugin-pack"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wisp_plugin_pack"
path = "src/lib.rs"

[[bin]]
name = "wisp-plugin-pack"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "instantiate"]
# The host app can verify and lay out a package without linking wasmtime or clap. The CLI keeps
# both on by default.
cli = ["dep:clap"]
instantiate = ["dep:wisp-plugin-host"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, optional = true }
flate2.workspace = true
ring.workspace = true
semver.workspace = true
serde_json.workspace = true
sha2.workspace = true
walkdir.workspace = true
wisp-plugin-api.workspace = true
wisp-plugin-host = { workspace = true, optional = true }
zip.workspace = true

[dev-dependencies]
tempfile = "3"
wat.workspace = true

[lints]
workspace = true